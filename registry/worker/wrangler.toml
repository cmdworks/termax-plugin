name            = "termax-plugin-registry"
main            = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── Local dev ────────────────────────────────────────────────────────────────
[dev]
port = 8787

# ── Production environment ───────────────────────────────────────────────────
[env.production]
routes = [
  { pattern = "api.plugins.termax.pp.ua/*", zone_name = "termax.pp.ua" }
]

[env.production.vars]
REGISTRY_BASE_URL = "https://plugins.termax.pp.ua"
ENVIRONMENT       = "production"

# Secrets (set via: wrangler secret put <NAME> --env production)
# ADMIN_SECRET  — HMAC-SHA256 key for /admin/publish webhook

[[env.production.d1_databases]]
binding       = "DB"
database_name = "termax-plugins-db"
database_id   = "7febecb9-a899-4ef5-bd53-5385f516f223"
migrations_dir = "../migrations"

[[env.production.kv_namespaces]]
binding = "KV"
id      = "157db9f553514a20bdcaca17d1e421d1"

[[env.production.r2_buckets]]
binding     = "R2"
bucket_name = "termax-plugins"

[[env.production.vectorize]]
binding    = "VECTORIZE"
index_name = "termax-plugin-embeddings"

# ── Local dev bindings (uses local D1/KV/R2 stubs) ───────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "termax-plugins-db"
database_id   = "local"
migrations_dir = "../migrations"

[[kv_namespaces]]
binding    = "KV"
id         = "local"

[[r2_buckets]]
binding     = "R2"
bucket_name = "termax-plugins"
