name: Plugin Registry — Deploy Infrastructure

on:
  push:
    tags:
      - 'registry-v*'

jobs:
  deploy-worker:
    name: Deploy CF Worker + Run Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Worker dependencies
        working-directory: registry/worker
        run: npm ci

      - name: Run D1 migrations (remote)
        working-directory: registry/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply termax-plugins-db --remote

      - name: Deploy Worker
        working-directory: registry/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env production

      - name: Smoke test (health check)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.plugins.termax.pp.ua/health || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Health check returned $STATUS. Please verify DNS and endpoint setup."
          fi
